<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Bunny Assistant</title><style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:transparent;font-family:'Segoe UI',Arial,sans-serif;color:#283050}button,input{font:inherit}button{cursor:pointer}#app{position:absolute;inset:8px 10px 12px;border-radius:26px;background:linear-gradient(155deg,#fcfbff 0%,#f8f2ff 55%,#eef8ff 100%);border:1px solid #e1dbf4;box-shadow:0 10px 24px #231b4e45;overflow:hidden}.top{height:59px;padding:14px 16px;display:flex;gap:10px;align-items:center;cursor:grab;user-select:none}.logo{width:35px;height:35px;display:grid;place-items:center;background:#ede3ff;border-radius:12px;font-size:23px}.title{flex:1}.title b{display:block;font-size:15px;color:#302454}.title small{font-size:11px;color:#867d9c}.actions{display:flex;gap:6px}.winbtn{height:28px;width:29px;border:0;border-radius:9px;background:#edeafa;color:#635b82}.winbtn:hover{background:#dcd2f7}#close:hover{background:#ffe3e5;color:#a52844}.hero{height:192px;margin:0 15px;border-radius:20px;background:radial-gradient(circle at 52% 70%,#fef9ff 0,#e9e3ff 65%,#dcd7ff 100%);position:relative;display:flex;align-items:center;justify-content:center}.sparkle{position:absolute;color:#a393f6}.s1{left:34px;top:36px}.s2{right:38px;top:54px}.s3{right:75px;bottom:19px}.bunny{position:relative;width:145px;height:148px;cursor:pointer;filter:drop-shadow(0 10px 8px #7c65a82b);animation:float 3s ease-in-out infinite}.ear{position:absolute;top:0;height:79px;width:42px;border-radius:50% 50% 28% 28%;background:#fff;border:2px solid #e8dcec}.ear:after{content:'';position:absolute;inset:10px 9px 13px;background:#ffb4ce;border-radius:inherit}.ear.l{left:26px;transform:rotate(-13deg)}.ear.r{right:26px;transform:rotate(13deg)}.head{position:absolute;top:42px;left:10px;width:125px;height:99px;background:white;border-radius:49% 49% 47% 47%;border:2px solid #f0e7f1}.eye{position:absolute;top:39px;width:10px;height:15px;background:#33334a;border-radius:50%;animation:blink 5s infinite}.eye.l{left:37px}.eye.r{right:37px}.cheek{position:absolute;top:56px;width:23px;height:10px;border-radius:50%;background:#ffd1de}.cheek.l{left:16px}.cheek.r{right:16px}.nose{position:absolute;top:54px;left:56px;width:10px;height:8px;border-radius:50%;background:#f196b8}.mouth{position:absolute;top:64px;left:55px;color:#ad6995;font-size:17px}.speech{position:absolute;top:11px;right:10px;max-width:170px;padding:8px 11px;background:#fff;border-radius:13px;box-shadow:0 4px 12px #75709a22;color:#6d5a9b;font-size:11px;display:none}.status{margin:14px 19px 8px;display:flex;align-items:center;gap:7px;font-size:12px;color:#66718e}.dot{height:8px;width:8px;background:#41cba0;border-radius:50%}.label{margin:0 19px 7px;font-size:12px;font-weight:700;color:#433865}.entry{margin:0 16px;display:flex;gap:7px;background:#fff;border-radius:15px;border:1px solid #e0dbee;padding:6px;box-shadow:0 4px 11px #4134840c}#input{min-width:0;flex:1;padding:7px;border:0;outline:0;background:none;font-size:13px;color:#302454}#send{border:0;background:#7864d6;color:#fff;border-radius:11px;padding:0 15px;font-weight:700;font-size:12px}#send:disabled{opacity:.5}.quick{margin:13px 16px;display:flex;gap:6px;flex-wrap:wrap}.chip{border:1px solid #e5dffa;border-radius:20px;background:#fff;padding:7px 10px;color:#62518f;font-size:11px}.chip:hover{background:#eee7ff}.reply{margin:0 17px;padding:9px 12px;min-height:46px;border-radius:12px;background:#eeeafa;color:#594b80;font-size:12px;line-height:1.4}.foot{position:absolute;bottom:13px;left:0;right:0;text-align:center;color:#9088a6;font-size:10px}@keyframes float{50%{transform:translateY(-7px)}}@keyframes blink{0%,94%,100%{transform:scaleY(1)}96%{transform:scaleY(.15)}}.bounce{animation:jump .4s ease!important}@keyframes jump{50%{transform:translateY(-25px)}}
</style></head><body><main id="app"><header class="top" id="drag"><span class="logo">🐰</span><div class="title"><b>Bunny Assistant</b><small>Your little Windows helper</small></div><div class="actions"><button class="winbtn" id="min" title="Minimize">—</button><button class="winbtn" id="close" title="Quit">✕</button></div></header><section class="hero"><span class="sparkle s1">✦</span><span class="sparkle s2">✧</span><span class="sparkle s3">✦</span><div class="bunny" id="bunny" title="Click me"><div class="ear l"></div><div class="ear r"></div><div class="head"><i class="eye l"></i><i class="eye r"></i><i class="cheek l"></i><i class="cheek r"></i><i class="nose"></i><span class="mouth">ᴗ</span></div></div><div id="speech" class="speech">Hi! 🐰</div></section><div class="status"><span class="dot"></span>Offline assistant · Ready to help</div><p class="label">What would you like me to do?</p><form class="entry" id="form"><input id="input" autocomplete="off" maxlength="200" placeholder="Try: open chrome" aria-label="Command"/><button type="submit" id="send">Go ➜</button></form><div class="quick"><button class="chip" data-cmd="open chrome">🌐 Chrome</button><button class="chip" data-cmd="open notepad">📝 Notepad</button><button class="chip" data-cmd="open calculator">🧮 Calculator</button><button class="chip" data-cmd="open files">📁 Files</button></div><div class="reply" id="reply" role="status" aria-live="polite">Hello! Type a command or tap a shortcut. ✨</div><footer class="foot">Made for Windows 7 · Type “help” for commands</footer></main><script src="renderer.js"></script></body></html>
