name: Build Windows 7 Pet EXE
on:
  workflow_dispatch:
  push:
    branches: [main]
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '18'
      - name: Install
        run: npm install --no-audit --no-fund
      - name: Build portable EXE for Windows 7 x64
        run: npm run build:win7
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - uses: actions/upload-artifact@v4
        with:
          name: Bunny-Desktop-Pet-Win7-x64
          path: dist/*.exe
